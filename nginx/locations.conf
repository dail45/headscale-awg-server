# Add these locations INSIDE the HTTPS server block for your domain (e.g. vpn.example.com)
# in nginx-ui. Nginx must be on Docker network "nginx".
# TLS certificate and port 443 are configured by nginx-ui, not here.
# Names are resolved at nginx reload; reload nginx after containers are recreated.

location = /admin {
    return 308 /admin/;
}

location ^~ /admin/ {
    proxy_pass http://hs-awg-headplane:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_buffering off;
}

location / {
    proxy_pass http://hs-awg-headscale:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header True-Client-IP $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_buffering off;
}
